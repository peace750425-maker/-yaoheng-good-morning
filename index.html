<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<title>曜衡｜AI 每日早安圖</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b0d11;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",
  "Microsoft JhengHei",sans-serif;
}

.app{
  max-width:520px;
  margin:auto;
  padding:32px 20px 50px;
}

.brand{
  font-size:14px;
  letter-spacing:4px;
  color:#c8a866;
  margin-bottom:8px;
}

h1{
  margin:0 0 8px;
  font-size:30px;
}

.description{
  color:#8e96a3;
  line-height:1.7;
  font-size:14px;
  margin-bottom:30px;
}

.panel{
  background:#151920;
  border:1px solid #292f39;
  border-radius:24px;
  padding:20px;
}

label{
  display:block;
  color:#aeb5bf;
  font-size:14px;
  margin-bottom:9px;
}

input{
  width:100%;
  height:58px;
  background:#0d1015;
  border:1px solid #343b47;
  border-radius:16px;
  color:#fff;
  font-size:18px;
  padding:0 16px;
  margin-bottom:14px;
}

.generate{
  width:100%;
  height:60px;
  border:0;
  border-radius:17px;
  background:linear-gradient(135deg,#f0dda7,#b38b48);
  color:#15110a;
  font-size:18px;
  font-weight:800;
}

.generate:disabled{
  opacity:.55;
}

.status{
  text-align:center;
  min-height:24px;
  margin:18px 0;
  color:#a8b0bb;
  font-size:14px;
}

.preview{
  width:100%;
  aspect-ratio:4/5;
  border-radius:20px;
  overflow:hidden;
  background:#090b0e;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.placeholder{
  color:#59616c;
  text-align:center;
  line-height:1.8;
}

#result{
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}

.download{
  display:none;
  width:100%;
  margin-top:14px;
  height:55px;
  border:1px solid #343b47;
  border-radius:16px;
  background:#232832;
  color:#fff;
  font-size:17px;
  font-weight:700;
}

.note{
  color:#656e79;
  text-align:center;
  font-size:12px;
  margin-top:18px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="app">

  <div class="brand">YAO HENG</div>

  <h1>每日早安圖</h1>

  <div class="description">
    輸入日期，其餘交給 AI。<br>
    每次重新創作文字、場景、構圖與整體視覺。
  </div>

  <div class="panel">

    <label>早安圖日期</label>

    <input
      type="date"
      id="date"
    >

    <button
      class="generate"
      id="generate"
      onclick="generatePoster()"
    >
      一鍵 AI 生成
    </button>

    <div
      class="status"
      id="status"
    >
      準備生成今天的作品
    </div>

    <div class="preview">

      <div
        class="placeholder"
        id="placeholder"
      >
        YOUR MORNING<br>
        YOUR STORY
      </div>

      <img
        id="result"
        alt="每日早安圖"
      >

    </div>

    <button
      class="download"
      id="download"
      onclick="saveImage()"
    >
      儲存早安圖
    </button>

  </div>

  <div class="note">
    每一天，都應該是一張全新的作品。<br>
    曜衡
  </div>

</div>

<script>

const dateInput =
document.getElementById("date");

const now = new Date();

dateInput.value =
now.getFullYear()
+"-"+
String(now.getMonth()+1).padStart(2,"0")
+"-"+
String(now.getDate()).padStart(2,"0");


async function generatePoster(){

  const date =
  dateInput.value;

  if(!date){
    alert("請先選擇日期");
    return;
  }

  const button =
  document.getElementById("generate");

  const status =
  document.getElementById("status");

  button.disabled = true;

  button.innerText =
  "AI 創作中...";

  status.innerText =
  "正在構思今天完全不同的早安圖...";

  try{

    const response =
    await fetch("/api/generate",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        date:date
      })

    });

    const data =
    await response.json();

    if(!response.ok){
      throw new Error(
        data.error || "生成失敗"
      );
    }

    const image =
    document.getElementById("result");

    image.src =
    data.image;

    image.style.display =
    "block";

    document.getElementById(
      "placeholder"
    ).style.display="none";

    document.getElementById(
      "download"
    ).style.display="block";

    status.innerText =
    "今日早安圖完成";

  }

  catch(error){

    console.error(error);

    status.innerText =
    "AI 尚未連接，下一步設定生成系統";

  }

  finally{

    button.disabled=false;

    button.innerText=
    "重新生成另一版";

  }

}


async function saveImage(){

  const image =
  document.getElementById("result");

  if(!image.src){
    return;
  }

  try{

    const response =
    await fetch(image.src);

    const blob =
    await response.blob();

    const url =
    URL.createObjectURL(blob);

    const link =
    document.createElement("a");

    link.href=url;

    link.download=
    "曜衡早安圖-"+
    dateInput.value+
    ".png";

    link.click();

    URL.revokeObjectURL(url);

  }

  catch(e){

    window.open(
      image.src,
      "_blank"
    );

  }

}

</script>

</body>
</html>
